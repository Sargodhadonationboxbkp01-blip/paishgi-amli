<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>ذمہ دار پورٹل</title>
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#17231d;--muted:#66756d;--line:#e2e8e4;
--p:#2f6f4f;--pl:#e6f3ec;--a:#1f5f8b;--al:#e5eff8;--danger:#b3432b;--warn:#8a6d1f;--warnl:#fbf1d6;
--acc:var(--p);--accl:var(--pl)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic",Tahoma,sans-serif;font-size:15px;line-height:1.8}
.hero{background:linear-gradient(135deg,#2f6f4f,#1f5f8b);color:#fff;padding:12px 16px}
.hero-in{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ttl{font-size:19px;font-weight:700}.who{font-size:12.5px;opacity:.85}
.wrap{max-width:1040px;margin:0 auto;padding:16px 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,30,.05)}
h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input,textarea,select{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfb;color:var(--ink);font-family:inherit;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accl)}
input:disabled,textarea:disabled{background:#f0f2f1;color:#55635b;cursor:not-allowed}
textarea{resize:vertical;min-height:52px}
.btn{cursor:pointer;border:none;border-radius:10px;padding:9px 16px;font-family:inherit;font-size:13.5px;font-weight:700;background:var(--acc);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn:disabled{background:#c9d1cc;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--line)}
.btn.light{background:rgba(255,255,255,.18);color:#fff}
.btn.warn{background:var(--warnl);color:var(--warn)}
.btn.danger{background:#f8e3de;color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:150px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 18px;font-family:inherit;font-weight:700;font-size:14px}
.tab.on{color:#fff;border-color:transparent}
.tab.on.tp{background:var(--p)}.tab.on.ta{background:var(--a)}.tab.on.tr{background:#4b5563}
.dot{background:#d9412b;color:#fff;border-radius:999px;font-size:11px;padding:0 7px;margin-inline-start:5px}
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mbar input{width:auto;min-width:170px;font-weight:700}
.mlabel{font-weight:700;font-size:16px;color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 11px}
.b-draft{background:#eef1ef;color:#5b6a62}.b-sub{background:var(--warnl);color:var(--warn)}
.b-lock{background:#f8e3de;color:var(--danger)}.b-done{background:var(--pl);color:var(--p)}.b-info{background:var(--accl);color:var(--acc)}
.ban{border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;font-weight:600}
.ban.info{background:var(--accl);color:var(--acc)}.ban.warn{background:var(--warnl);color:var(--warn)}
.ban.lock{background:#f8e3de;color:var(--danger)}.ban.done{background:var(--pl);color:var(--p)}
.day{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);
border-inline-start:5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.day.filled{border-inline-start-color:var(--acc)}
.day.dirty{box-shadow:0 0 0 2px #f0c14b88}
.day.today{background:#fffdf3}
.dbadge{text-align:center;background:var(--accl);border-radius:12px;padding:8px 4px}
.day.fri .dbadge{background:#fdf0d5}
.dnum{font-size:26px;font-weight:800;line-height:1.1;color:var(--acc)}
.dname{font-size:13px;font-weight:700}.dfull{font-size:10.5px;color:var(--muted)}
.ref{background:#f5f7f6;border-radius:8px;padding:5px 10px;font-size:12.5px;color:#48574f;margin-bottom:4px}
.dact{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px}
.ok{color:var(--p);font-weight:800;font-size:12px;opacity:0;transition:opacity .3s}.ok.show{opacity:1}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;z-index:20;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.bar-in{max-width:1040px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tablewrap{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
.rt th,.rt td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
.rt th.gp{background:var(--p);color:#fff;text-align:center}.rt th.ga{background:var(--a);color:#fff;text-align:center}
.rt th.gp2{background:var(--pl);color:var(--p)}.rt th.ga2{background:var(--al);color:var(--a)}
.rt th.g0{background:#eef1ef;color:#48574f}
.rt tr.fri td{background:#fffaf0}
.rt tr.grp td{background:#eef1ef;font-size:13.5px}
.dash{color:#b5beb9}
.msg{color:var(--danger);font-size:13px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(15,25,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#17231d;color:#fff;padding:10px 20px;border-radius:999px;z-index:60;font-weight:700;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}
.login{max-width:400px;margin:8vh auto 0;padding:0 14px}
.login .head{text-align:center;margin-bottom:14px}
.login .logo{font-size:44px}
@media (max-width:640px){
 .day{grid-template-columns:76px 1fr}.dact{grid-column:1/-1;flex-direction:row;justify-content:flex-start}
 .dnum{font-size:22px}
}
@media print{.noprint,.bar,.hero,.tabs{display:none!important}body{background:#fff}.card{box-shadow:none;border:none;padding:0}.wrap{padding:0}}

/* ===== v3: نستعلیق فونٹ + خوبصورت ڈیزائن ===== */
body{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Segoe UI",Tahoma,serif;font-size:16px;line-height:2.15;background:linear-gradient(180deg,#e6f1ea 0,#f3f6f4 340px) fixed}
input,textarea,select,button{font-family:inherit;line-height:2}
input,textarea,select{font-size:16px;padding:3px 14px;border-radius:12px}
textarea{line-height:2.1;padding-top:8px}
label{font-size:14px;line-height:1.9;font-weight:500}
.btn{font-size:15px;padding:3px 18px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.13)}
.btn.ghost{box-shadow:none;background:#fff}
.btn.sm{padding:0 12px;font-size:13.5px}
.hero{background:linear-gradient(120deg,#1f5f8b,#2f6f4f 62%,#3f8a63);padding:16px;border-radius:0 0 28px 28px;box-shadow:0 10px 26px rgba(31,95,139,.28)}
.ttl{font-size:24px;line-height:2}.who{font-size:14px}
.card{border-radius:20px;border:1px solid #e4ece7;box-shadow:0 8px 22px rgba(20,60,40,.07)}
h2{font-size:19px;line-height:2}
.tab{font-size:16px;padding:1px 20px;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.badge{font-size:13px;padding:0 12px;line-height:2}
.ban{line-height:2.1;font-size:14.5px}
.day{border-radius:18px;box-shadow:0 4px 12px rgba(20,60,40,.06)}
.dbadge{background:linear-gradient(160deg,var(--accl),#fff);border:1px solid var(--accl)}
.dnum{font-family:"Segoe UI",Tahoma,sans-serif;font-size:28px}.dname{font-size:14px;line-height:1.9}
.rt th,.rt td{padding:3px 10px;line-height:2.05}
.rt tbody tr:nth-child(even) td{background:#fafcfb}
.rt tr.fri td{background:#fffaf0!important}
.mlabel{font-size:20px}
.toast{font-size:15px;line-height:2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.stat{border-radius:18px;padding:8px 14px;color:#fff;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.stat b{display:block;font-size:30px;line-height:1.5;font-family:"Segoe UI",Tahoma,sans-serif}.stat span{font-size:14px}
.s1{background:linear-gradient(135deg,#2f6f4f,#3f8a63)}.s2{background:linear-gradient(135deg,#c08a1c,#e0a93b)}
.s3{background:linear-gradient(135deg,#b3432b,#d2603f)}.s4{background:linear-gradient(135deg,#1f5f8b,#3a82b3)}
.pbar{height:9px;background:#e3eae6;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--p);border-radius:99px}
.pbar.a i{background:var(--a)}.pcell{min-width:140px}.pcell b{font-family:"Segoe UI",Tahoma,sans-serif}
.login .logo{width:86px;height:86px;margin:0 auto 6px;border-radius:26px;background:linear-gradient(135deg,#2f6f4f,#1f5f8b);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 12px 26px rgba(31,95,139,.32)}
@media (max-width:640px){body{font-size:15px}.ttl{font-size:20px}}

/* ===== v4: پرنٹ، خلاصہ اور اعداد و شمار ===== */
@page{size:A4 landscape;margin:9mm}
.mbox{max-width:580px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:2px 10px;margin-top:8px;padding:8px 12px;background:var(--accl);border-radius:14px}
.sgrid label{margin:0;font-size:12.5px;color:#36453d;line-height:1.8}
.sgrid input{padding:0 8px;font-size:15px;font-family:"Segoe UI",Tahoma,sans-serif;text-align:center;border-radius:10px}
.sgt{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--acc);margin-top:4px}
.figchips{display:flex;flex-wrap:wrap;gap:4px}
.fc{background:#e8f1f8;color:#1f5f8b;border-radius:99px;padding:0 9px;font-size:12px;line-height:1.9;white-space:nowrap}
.fc b{font-family:"Segoe UI",Tahoma,sans-serif}
.rt.tight th,.rt.tight td{padding:2px 6px;font-size:12px;line-height:1.95}
.rt .num{text-align:center;font-family:"Segoe UI",Tahoma,sans-serif}
.rt tr.tot td{background:#e8f1ec!important;font-weight:700}
.sumsec{background:#fff;border:1px solid #e1ebe5;border-radius:16px;padding:10px 16px 14px;margin-top:12px}
.sumsec h3{margin:0 0 4px;font-size:17px;line-height:2}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:linear-gradient(160deg,#f1f8f4,#fff);border:1px solid #dfece5;border-radius:14px;padding:4px 12px;text-align:center}
.kpi.b{background:linear-gradient(135deg,#2f6f4f,#1f5f8b);border:none}.kpi.b .kv,.kpi.b .kl{color:#fff}
.kv{font-size:28px;font-weight:800;color:var(--p);line-height:1.6;font-family:"Segoe UI",Tahoma,sans-serif}
.kl{font-size:13.5px;color:#48574f;line-height:1.9}
.sbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#eee;margin-top:8px}.sbar i{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:13px;margin-top:4px;flex-wrap:wrap}
.legend b{font-family:"Segoe UI",Tahoma,sans-serif}
.pendbox{background:#fff3e9;border:1.5px dashed #c2410c;border-radius:10px;padding:6px 12px;margin-top:2px;font-size:13.5px;color:#9a3412;display:flex;justify-content:space-between;align-items:center}
.pendbox b{font-family:"Segoe UI",Tahoma,sans-serif;font-size:16px}
.sumsec{border-inline-start-width:6px;border-inline-start-style:solid}
.sumsec h3{display:flex;align-items:center;gap:8px}
.pend-ok{color:var(--p)!important}.pend-bad{color:#c2410c!important}
.rt td.pend,.rt th.pend{background:#fff3e9}
.monthpicker{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accl,#e6f3ec),#fff);border:1px solid var(--line);border-radius:18px;padding:9px 14px;flex-wrap:wrap}
.monthpicker .mnav{width:36px;height:36px;flex:none;border-radius:50%;background:#fff;color:var(--acc,var(--p));border:1.5px solid var(--line);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 7px rgba(0,0,0,.07);cursor:pointer;line-height:1}
.monthpicker .mnav:hover{background:var(--acc,var(--p));color:#fff;border-color:transparent}
.monthpicker .mcenter{display:flex;align-items:center;gap:9px;flex:1;justify-content:center;min-width:180px;flex-wrap:wrap}
.monthpicker .micon{font-size:19px}
.monthpicker .mbig{font-size:19px;font-weight:800;color:var(--acc,var(--p));white-space:nowrap}
.monthpicker input[type=month]{width:auto;max-width:148px;padding:5px 10px;font-size:12.5px;border-radius:10px;background:#fff;border:1.5px solid var(--line)}
.monthpicker .mtoday{flex:none}
.zchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.zchip{cursor:pointer;border:1.5px solid var(--line);background:#fff;color:#6b7a72;border-radius:999px;padding:5px 14px;font-family:inherit;font-size:13px;font-weight:700;transition:all .15s}
.zchip.on{background:linear-gradient(135deg,var(--p),#3f8a63);color:#fff;border-color:transparent;box-shadow:0 3px 8px rgba(47,111,79,.28)}
.filtbar label{margin-top:0}
@media (max-width:640px){.monthpicker{justify-content:center}.monthpicker .mbig{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal hidden" id="modal"><div class="mbox" id="mbox"></div></div>
<script>
/* ===== helpers ===== */
const $=id=>document.getElementById(id);

/* اگر یہ صفحہ GitHub Pages (یا کسی اور سائٹ) سے کھلا ہو تو یہاں اپنی Apps Script Web App کا
   /exec لنک لکھیں۔ Apps Script کے اندر سے کھلنے پر اس کی ضرورت نہیں (خالی چھوڑ دیں تو بھی چلے گا)۔ */
const EXEC_URL='https://script.google.com/macros/s/AKfycbzmLCD2MiCNvh9ZXR6Btqr2no0l0lmR5ayXW-so27zGiqyknMuWbll5unFq_tpq6jDU/exec';

function gsRun(fn){
  const args=Array.prototype.slice.call(arguments,1);
  if(window.google&&google.script&&google.script.run){
    return new Promise((resolve,reject)=>{
      const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error((e&&e.message)||e)));
      runner[fn].apply(runner,args);
    });
  }
  // Apps Script کے باہر (مثلاً GitHub Pages) سے چلنے پر: عام HTTP کے ذریعے بات کریں
  if(!EXEC_URL)return Promise.reject(new Error('EXEC_URL سیٹ نہیں کیا گیا — index.html میں اپنا Web App لنک درج کریں۔'));
  return fetch(EXEC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
    .then(r=>{if(!r.ok)throw new Error('سرور کا جواب: '+r.status);return r.json();})
    .then(j=>{if(!j||j.ok!==true)throw new Error((j&&j.error)||'نامعلوم خرابی');return j.value;})
    .catch(e=>{throw new Error(/Failed to fetch|NetworkError/.test(e.message)?'سرور تک رسائی نہیں ہو سکی (انٹرنیٹ یا CORS مسئلہ)۔':e.message);});
}
async function call(fn){ const a=Array.prototype.slice.call(arguments,1);
  try{ return await gsRun.apply(null,[fn].concat(a)); }catch(e){ toast('خرابی: '+e.message,'err'); return null; } }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const DAYS=['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];
const MONTHS=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const p2=n=>String(n).padStart(2,'0');
function curMonth(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1);}
function todayStr(){const d=new Date();return curMonth()+'-'+p2(d.getDate());}
function daysIn(m){const p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function dstr(m,d){return m+'-'+p2(d);}
function wdOf(ds){return new Date(ds+'T00:00:00').getDay();}
function monthLabel(m){const p=m.split('-');return MONTHS[+p[1]-1]+' '+p[0];}
function shiftM(m,k){const p=m.split('-').map(Number);const d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+p2(d.getMonth()+1);}
function fmtTime(ms){return ms?new Date(ms).toLocaleString('ur-PK'):'';}
function toast(msg,type){const t=document.createElement('div');t.className='toast'+(type==='err'?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function showModal(html){$('mbox').innerHTML=html;$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');}
function askConfirm(text){return new Promise(res=>{
  showModal(`<h2>تصدیق</h2><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="cn">نہیں</button><button class="btn" id="cy">جی ہاں</button></div>`);
  $('cy').onclick=()=>{closeModal();res(true);};$('cn').onclick=()=>{closeModal();res(false);};});}
function pBadge(s){return s==='locked'?'<span class="badge b-lock">🔒 پیشگی لاک</span>':s==='submitted'?'<span class="badge b-sub">⏳ پیشگی جمع — جائزے کا انتظار</span>':'<span class="badge b-draft">✏️ پیشگی ڈرافٹ</span>';}
function mBadge(f){return f?'<span class="badge b-done">✔ مہینہ جمع شدہ</span>':'<span class="badge b-draft">مہینہ کھلا ہے</span>';}
function monthBar(id,val,fn){const cur=curMonth();
  return `<div class="monthpicker">
  <button class="mnav" type="button" title="پچھلا مہینہ" onclick="${fn}(shiftM('${val}',-1))">‹</button>
  <div class="mcenter"><span class="micon">🗓️</span><span class="mbig">${monthLabel(val)}</span>
  <input type="month" id="${id}" value="${val}" onchange="if(this.value)${fn}(this.value)"></div>
  <button class="mnav" type="button" title="اگلا مہینہ" onclick="${fn}(shiftM('${val}',1))">›</button>
  ${val!==cur?`<button class="btn sm ghost mtoday" type="button" onclick="${fn}('${cur}')">⟳ رواں مہینہ</button>`:''}
  </div>`;}
function hero(){const r=me.role==='admin'?'ایڈمن':me.role==='nazim'?'ناظم':'ذمہ دار';
  return `<div class="hero noprint"><div class="hero-in"><div><div class="ttl">📋 ذمہ دار پورٹل</div><div class="who">${esc(me.name)} · ${r}</div></div>
  <button class="btn light" onclick="logout()">لاگ آؤٹ</button></div></div>`;}
const cell=v=>v?esc(v):'<span class="dash">—</span>';

/* ===== report table (پیشگی + عملی ساتھ ساتھ) ===== */
function reportTable(list,o){
  o=o||{};const span=o.actions?8:7;
  let h=`<div class="tablewrap"><table class="rt"><thead><tr><th class="g0" rowspan="2">تاریخ</th><th class="g0" rowspan="2">دن</th>
  <th class="gp" colspan="2">📝 پیشگی جدول</th><th class="ga" colspan="3">✅ عملی جدول</th>${o.actions?'<th class="g0" rowspan="2"></th>':''}</tr>

function drawEntry(mode){

  }
  const cls=isP?'mode-p':'mode-a';

async function saveDays(list){
  const isP=zTab==='p';
  const items=list.map(d=>({date:dstr(selMonth,d),muqam:$('m_'+d).value.trim(),jadwal:$('j_'+d).value.trim(),stats:isP?undefined:collectStats(d)}));

  if(!r)return false; if(!r.ok){toast(r.error,'err');return false;}
  items.forEach((it,i)=>{const d=list[i];const e=md.entries[it.date]||(md.entries[it.date]={});

    delete dirty[d];const row=$('row_'+d);row.classList.remove('dirty');row.classList.toggle('filled',!!(it.muqam||it.jadwal||(it.stats&&Object.keys(it.stats).length)));
    const b=$('sv_'+d);if(b)b.disabled=true;const ok=$('ok_'+d);ok.classList.add('show');setTimeout(()=>ok.classList.remove('show'),1800);});
  $('dcount').textContent='غیر محفوظ: '+Object.keys(dirty).length;toast('محفوظ ہو گیا ✓ ('+items.length+')');return true;
}

function summaryFromRows(rows,pa,su){
  const m={};
  rows.forEach(v=>{const x=m[v.Username]||(m[v.Username]={Username:v.Username,Name:v.Name,PaishgiDays:0,AmliDays:0,Totals:{},PaishgiStatus:pa[v.Username]||'draft',MonthSubmitted:!!su[v.Username]});
    if(v.MuqamPaishgi||v.PaishgiJadwal)x.PaishgiDays++;if(hasAmli(v))x.AmliDays++;

const LIBS={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',h2c:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'};
const loaded={};

  return loaded[k]=new Promise((res,rej)=>{const t=document.createElement('script');t.src=LIBS[k];t.onload=()=>check()?res():rej(new Error('lib'));t.onerror=()=>{delete loaded[k];rej(new Error('lib'));};document.head.appendChild(t);}); }
async function saveFile(name,blob){

    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();

  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet(s.rows);ws['!cols']=(s.widths||[]).map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31));});
  wb.Workbook={Views:[{RTL:true}]};

async function exportPdf(fname,html){
  toast('PDF بن رہی ہے… ذرا انتظار کریں');
  try{await loadLib('jspdf',()=>window.jspdf);await loadLib('h2c',()=>window.html2canvas);}catch(e){toast('PDF لائبریری لوڈ نہ ہو سکی، انٹرنیٹ چیک کریں','err');return;}
  const root=document.createElement('div');root.setAttribute('dir','rtl');
  root.style.cssText='position:fixed;left:-20000px;top:0;width:1120px;background:#fff;padding:20px;color:#17231d';root.innerHTML=html;document.body.appendChild(root);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const sc=2,canvas=await html2canvas(root,{scale:sc,backgroundColor:'#fff'});
    const W=canvas.width,pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),mg=18,ratio=(pw-2*mg)/W,pageH=(ph-2*mg)/ratio;
    const top=root.getBoundingClientRect().top,th=root.querySelector('thead');
    const hT=th?(th.getBoundingClientRect().top-top)*sc:0,hH=th?th.getBoundingClientRect().height*sc:0;
    const units=[...root.querySelectorAll('tbody tr,[data-pb]')].map(e=>{const r=e.getBoundingClientRect();return{t:(r.top-top)*sc,b:(r.bottom-top)*sc,row:e.tagName==='TR'};}).sort((a,b)=>a.t-b.t);
    const pages=[];let cur={s:0,head:false};
    units.forEach(u=>{const cap=pageH-(cur.head?hH:0);if(u.b-cur.s>cap&&u.t>cur.s+1){cur.e=u.t;pages.push(cur);cur={s:u.t,head:u.row&&hH>0};}});
    cur.e=canvas.height;pages.push(cur);
    pages.forEach((p,i)=>{if(i)pdf.addPage();const head=p.head?hH:0,h=Math.min(p.e-p.s+head,pageH*1.02);
      const c=document.createElement('canvas');c.width=W;c.height=Math.round(h);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,h);
      if(head)x.drawImage(canvas,0,hT,W,hH,0,0,W,hH);
      x.drawImage(canvas,0,p.s,W,p.e-p.s,0,head,W,p.e-p.s);
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',mg,mg,W*ratio,c.height*ratio);});
    await saveFile(fname,pdf.output('blob'));
  }catch(e){toast('PDF نہیں بن سکی: '+e.message,'err');}
  finally{root.remove();}
}
const HDR=['تاریخ','دن','مقام (پیشگی)','پیشگی جدول','مقام (عملی)','عملی جدول'].concat(METRICS.map(m=>m.l));
function xlRows(list,nm){return [(nm?['ذمہ دار']:[]).concat(HDR)].concat(list.map(v=>(nm?[v.Name]:[]).concat([v.Date,v.Din,v.MuqamPaishgi||'',v.PaishgiJadwal||'',v.MuqamAmli||'',v.AmliJadwal||'']).concat(METRICS.map(m=>(v.Stats||{})[m.k]||0))));}
function xlSummary(r,N){const g=(x,k)=>(x.Totals||{})[k]||0;
  return [['ذمہ دار','پیشگی درج (دن)','عملی درج (دن)','مہینے کے کل دن','پیشگی کی حالت','مہینہ جمع'].concat(METRICS.map(m=>m.l),['باقی آڈٹ'])]
   .concat(r.map(x=>[x.Name,x.PaishgiDays,x.AmliDays,N,ST[x.PaishgiStatus]||'ڈرافٹ',x.MonthSubmitted?'جی ہاں':'نہیں'].concat(METRICS.map(m=>g(x,m.k)),[pendAudit(x.Totals||{})])))
   .concat([['میزان','','','','',''].concat(METRICS.map(m=>r.reduce((a,x)=>a+g(x,m.k),0)),[r.reduce((a,x)=>a+pendAudit(x.Totals||{}),0)])]);}
const repHeader=(t,s)=>`<div style="background:linear-gradient(120deg,#1f5f8b,#2f6f4f);color:#fff;border-radius:14px;padding:10px 22px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:24px;line-height:2">📋 ذمہ دار پورٹل</div><div style="font-size:17px;opacity:.92">${esc(t)}</div></div><div style="text-align:left"><div style="font-size:21px;font-weight:700;line-height:2">${esc(s)}</div><div style="font-size:12px;opacity:.85">تیار کردہ: ${new Date().toLocaleDateString('en-GB')}</div></div></div>`;
async function doExport(kind,fmt){
  let title,sub,tag,body,sheets;
  if(kind==='nsum'){
    if(!lastSum||!lastSum.length){toast('پہلے خلاصہ لوڈ ہونے دیں','err');return;}
    const rows=sumSel===null?lastSum:lastSum.filter(x=>sumSel.has(x.Username));
    if(!rows.length){toast('کوئی ذمہ دار منتخب نہیں','err');return;}
    const N=daysIn(nMonth);title='خلاصہ — '+(sumSel===null?'تمام ذمہ داران':'منتخب ذمہ داران ('+rows.length+')');sub=monthLabel(nMonth);tag='summary_'+nMonth;body=summaryTable(rows,N,false);
    sheets=[{name:'خلاصہ',rows:xlSummary(rows,N),widths:[22,14,14,14,14,12].concat(METRICS.map(()=>15))}];
  }else{
    let list,nm=false,who,m,N,sr,st;
    if(kind==='z'){list=monthList(md.entries,selMonth);who=me.name;m=selMonth;tag='report_'+me.username+'_'+m;st=md;}
    else if(kind==='nz'){list=monthList(nMd.entries,nMonth);who=nZName();m=nMonth;tag='report_'+nZ+'_'+m;st=nMd;}
    else{
      if(!lastRep||!lastRep.rows.length){toast('اس مہینے کا ڈیٹا موجود نہیں','err');return;}
      list=repFilterZ?lastRep.rows.filter(v=>v.Username===repFilterZ):lastRep.rows;
      if(!list.length){toast('منتخب ذمہ دار کا اس مہینے کوئی ڈیٹا نہیں','err');return;}
      nm=!repFilterZ;who=repFilterZ?zNameOf(repFilterZ):'تمام ذمہ داران';m=nMonth;tag='monthly_report_'+(repFilterZ||'all')+'_'+m;
      st={paishgiStatus:repFilterZ?(lastRep.paishgi[repFilterZ]||'draft'):'draft',monthSubmitted:repFilterZ?!!lastRep.subs[repFilterZ]:false};
    }
    title=who;sub=monthLabel(m);N=daysIn(m);
    if(nm){sr=summaryFromRows(list,lastRep.paishgi,lastRep.subs);
      body=reportTable(list,{group:true,badges:u=>pBadge(lastRep.paishgi[u]||'draft')+' '+mBadge(!!lastRep.subs[u])})+'<div data-pb style="height:10px"></div><h2 style="margin-top:14px">📊 خلاصہ</h2>'+summaryTable(sr,N,false);}
    else{sr=[{Name:who,PaishgiDays:list.filter(v=>v.MuqamPaishgi||v.PaishgiJadwal).length,AmliDays:list.filter(hasAmli).length,Totals:sumStats(list),PaishgiStatus:st.paishgiStatus,MonthSubmitted:st.monthSubmitted}];
      body=reportTable(list)+zSummaryHtml(list);}
    sheets=[{name:'رپورٹ',rows:[[title+' — '+sub],[]].concat(xlRows(list,nm)),widths:(nm?[20]:[]).concat([12,10,20,28,20,28],METRICS.map(()=>15))},
            {name:'خلاصہ',rows:xlSummary(sr,N),widths:[22,14,14,14,14,12].concat(METRICS.map(()=>15))}];
  }
  const html=repHeader(title,sub)+body+'<div data-pb style="text-align:center;font-size:11px;color:#6b7a72;margin-top:10px">— ذمہ دار پورٹل —</div>';
  if(fmt==='xlsx')await exportXlsx(tag+'.xlsx',sheets);else if(fmt==='print')printHtml(html);else await exportPdf(tag+'.pdf',html);
}
